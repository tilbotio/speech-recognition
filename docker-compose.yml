name: tilbot
services:
  yarn-install:
    extends:
      file: ../../docker-compose.yml
      service: yarn-install

  frontend:
    extends:
      file: ../../docker-compose.yml
      service: frontend

  backend:
    extends:
      file: ../../docker-compose.yml
      service: backend
    networks:
      tbnetwork:
      default:

  mongo:
    extends:
      file: ../../docker-compose.yml
      service: mongo

  speech-recognition:
    build:
      context: .
      args:
        PORT: ${PORT}
    restart: unless-stopped
    environment:
      MODELNAME: "tiny"
      LANGUAGE: "nl"
      PORT: 8082
    networks:
      tbnetwork:
    volumes:
      - .:/app

networks:
  tbnetwork:
    driver: bridge
    ipam:
      config:
        - subnet: 172.99.0.0/16
      driver: default

volumes:
  mongodb: